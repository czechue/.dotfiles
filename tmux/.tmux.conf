# Podstawowe ustawienia
unbind r
bind r source-file ~/.tmux.conf \; display "Config reloaded!"
set -g prefix C-b
set -g mouse on
set-option -g base-index 1
set-window-option -g pane-base-index 1

# Nawigacja
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# tmux-sessionizer (Ctrl+F bez prefiksu)
bind-key -n C-f run-shell "tmux neww tmux-sessionizer"

# lazygit popup (prefix + G)
bind-key G display-popup -E -w 95% -h 95% lazygit

# hunk popup — review-first diff viewer (prefix + H)
# `--watch` auto-reloads as the working tree changes, so this doubles as
# a "what is Claude writing right now?" pane while claude-code runs in
# another window. `-d` makes hunk inherit the current pane's working
# directory so `hunk diff` resolves to the right repo.
bind-key H display-popup -E -w 95% -h 95% -d "#{pane_current_path}" '$HOME/.dotfiles/bin/hunk-quiet diff --watch'

# Capture current pane (last 10k lines) into nvim in a new window.
# Useful for grabbing claude-code transcripts, logs, or long command output.
# run-shell runs synchronously so the temp file exists before nvim opens it.
bind e run-shell "tmux capture-pane -t '#{pane_id}' -p -S -10000 > /tmp/tmux-capture" \; new-window "nvim /tmp/tmux-capture"

# Pass Ctrl-O through to the running program (prefix + o).
# Coding agents like Claude Code use C-o to expand transcripts; tmux's default
# prefix+o (select-next-pane) is unused here since panes are navigated via hjkl.
bind o send-keys C-o

# Session list with Claude Code status next to each session name.
# choose-tree always renders its own "session_name:" tree label before our
# -F format (hardcoded in tmux's mode-tree.c:709 — not configurable). To make
# the name column behave like a fixed-width column, we pad the START of our
# format with `24 - len(session_name)` spaces — so for any name shorter than
# 24 chars, the next column (@claude_title or marker) always starts at the
# same screen offset. Names longer than 24 (e.g. "storefront-apps-home-tab-
# chatbot-input") overflow the budget and push their row's right side out;
# we accept that since it's the only way without forking tmux.
# Row layout (after tmux's "session_name:" label):
#   pad-to-24 spaces | @claude_title (blue, conditional) | attached marker
#   | @claude_status (~22 cells, fixed-width) | summary (60 ch trunc)
# -O time sorts by last activity so fresh sessions float to the top.
# @claude_status / @claude_summary are set per session+window by
# ~/.dotfiles/bin/tmux-claude-status (invoked from claude-code hooks).
# @claude_title is set manually via `prefix T`.
# tmux-claude-refresh-status recomputes elapsed timers, age-based color tiers,
# and clears >48h zombie entries right before opening choose-tree.
bind s run-shell "~/.dotfiles/bin/tmux-claude-refresh-status" \; \
  choose-tree -Zs -O activity \
    -F "#{?#{e|<:#{n:session_name},24},#{p-#{e|-:24,#{n:session_name}}: },}#{?@claude_title,#[fg=blue]#{@claude_title}#[default]  ,}#{?session_attached,#[fg=cyan]●#[default],·} #{@claude_status}#{?@claude_summary,  #{=60:@claude_summary},}"

# Same but filtered to only sessions where Claude is waiting on you.
bind S run-shell "~/.dotfiles/bin/tmux-claude-refresh-status" \; \
  choose-tree -Zs -O activity \
    -f "#{m:*waiting*,#{@claude_status}}" \
    -F "#{?#{e|<:#{n:session_name},24},#{p-#{e|-:24,#{n:session_name}}: },}#{?@claude_title,#[fg=blue]#{@claude_title}#[default]  ,}#{?session_attached,#[fg=cyan]●#[default],·} #{@claude_status}#{?@claude_summary,  #{=60:@claude_summary},}"

# Alternative session picker: fzf in a popup with true column alignment and
# a live preview pane showing the session's claude output. Kept additive
# (prefix s above stays as the proven choose-tree version) so the picker
# can be evaluated side-by-side.
bind C-s display-popup -E -w 90% -h 80% '~/.dotfiles/bin/tmux-claude-picker'

# Set/edit a manual title for the current session. tmux-claude-picker reads
# @claude_title and renders it as a column between the folder-derived session
# name and the claude status — useful for tagging sessions with what you're
# working on (e.g. "Auth refactor") beyond just the directory path.
# `-I` pre-fills the prompt with the existing title so it's edit-not-retype.
# An empty input clears the title. No `-t` needed: set-option defaults to
# the current session, which is what `prefix T` always operates on.
# (Earlier revision used `-t '#{session_name}'`, but command-prompt does
# NOT format-expand its template — tmux took the literal string as a
# target and errored with "No such session #{session_name}".)
bind T command-prompt -I "#{@claude_title}" -p "Session title: " \
    { set-option @claude_title "%%" }

# Git worktree launcher (prefix + W). Opens an fzf picker in a popup to create
# or switch to a SIBLING git worktree (../<repo>-<branch>) and open a dedicated
# tmux session in it. Sessions are named with tmux-sessionizer's convention
# (basename | tr . _), so they show up in the prefix s / S / C-s claude pickers
# automatically, and the branch is stored as @claude_title for an inline label.
# `-d "#{pane_current_path}"` lets the script detect the current repo (it walks
# up to the MAIN worktree, so it works from inside a linked worktree too).
# In the picker: enter = open/checkout · ctrl-n = new branch from query
# · ctrl-d = remove worktree + kill its session.
bind W display-popup -E -w 80% -h 70% -d "#{pane_current_path}" "$HOME/.dotfiles/bin/tmux-worktreeizer"

# Ustawienia okna
set-option -g status-position top
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
setw -g mode-keys vi

# Terminal settings
set -g default-terminal "tmux-256color"

# Ghostty/modern terminal support: true color, undercurl, image passthrough
set -sa terminal-features ",xterm-ghostty:RGB"
set -sa terminal-features ",xterm-256color:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux#v2.1.0'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'

# tmux copying
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @yank_action 'copy-pipe'

# Catppuccin configuration
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

# Load catppuccin
# run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux:
run '~/.tmux/plugins/tmux/catppuccin.tmux'

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"

# Format wyświetlania okien
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text " #{b:pane_current_path} | #W"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text  " #{b:pane_current_path} | #W"

# Format wyświetlania sesji
set -g @catppuccin_status_modules_left "session" # dodaje nazwę sesji po lewej

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
