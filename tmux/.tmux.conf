# Podstawowe ustawienia
unbind r
bind r source-file ~/.tmux.conf \; display "Config reloaded!"
set -g prefix C-b
set -g mouse on
set-option -g base-index 1
set-window-option -g pane-base-index 1

# Nawigacja
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# tmux-sessionizer (Ctrl+F bez prefiksu)
bind-key -n C-f run-shell "tmux neww tmux-sessionizer"

# lazygit popup (prefix + G)
bind-key G display-popup -E -w 95% -h 95% lazygit

# Capture current pane (last 10k lines) into nvim in a new window.
# Useful for grabbing claude-code transcripts, logs, or long command output.
# run-shell runs synchronously so the temp file exists before nvim opens it.
bind e run-shell "tmux capture-pane -t '#{pane_id}' -p -S -10000 > /tmp/tmux-capture" \; new-window "nvim /tmp/tmux-capture"

# Pass Ctrl-O through to the running program (prefix + o).
# Coding agents like Claude Code use C-o to expand transcripts; tmux's default
# prefix+o (select-next-pane) is unused here since panes are navigated via hjkl.
bind o send-keys C-o

# Session list with Claude Code status next to each session name.
# Row layout (after tmux's "session-name:" tree label that choose-tree adds):
#   attached marker (1 cell) | @claude_status (~20 cells, fixed-width) | summary (60 ch trunc)
# -O time sorts by last activity so fresh sessions float to the top.
# @claude_status / @claude_summary are set per session+window by
# ~/.dotfiles/bin/tmux-claude-status (invoked from claude-code hooks).
# tmux-claude-refresh-status recomputes elapsed timers, age-based color tiers,
# and clears >48h zombie entries right before opening choose-tree.
bind s run-shell "~/.dotfiles/bin/tmux-claude-refresh-status" \; \
  choose-tree -Zs -O time \
    -F "#{?session_attached,#[fg=cyan]●#[default],·} #{@claude_status}#{?@claude_summary,  #{=60:@claude_summary},}"

# Same but filtered to only sessions where Claude is waiting on you.
bind S run-shell "~/.dotfiles/bin/tmux-claude-refresh-status" \; \
  choose-tree -Zs -O time \
    -f "#{m:*waiting*,#{@claude_status}}" \
    -F "#{?session_attached,#[fg=cyan]●#[default],·} #{@claude_status}#{?@claude_summary,  #{=60:@claude_summary},}"

# Ustawienia okna
set-option -g status-position top
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
setw -g mode-keys vi

# Terminal settings
set -g default-terminal "tmux-256color"

# Ghostty/modern terminal support: true color, undercurl, image passthrough
set -sa terminal-features ",xterm-ghostty:RGB"
set -sa terminal-features ",xterm-256color:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux#v2.1.0'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'

# tmux copying
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @yank_action 'copy-pipe'

# Catppuccin configuration
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

# Load catppuccin
# run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux:
run '~/.tmux/plugins/tmux/catppuccin.tmux'

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"

# Format wyświetlania okien
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text " #{b:pane_current_path} | #W"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text  " #{b:pane_current_path} | #W"

# Format wyświetlania sesji
set -g @catppuccin_status_modules_left "session" # dodaje nazwę sesji po lewej

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
